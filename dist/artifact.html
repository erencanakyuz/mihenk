/* ===== styles/tokens.css ===== */
/* ==========================================================================
   MİHENK — design tokens
   Two palettes: normal (X-blue) and crisis (amber).
   Colour tokens are registered with @property so a palette swap on :root
   cross-fades instead of snapping. Nothing else changes between modes.
   ========================================================================== */

@property --c-bg        { syntax: '<color>'; inherits: true; initial-value: #000000; }
@property --c-bg-2      { syntax: '<color>'; inherits: true; initial-value: #16181c; }
@property --c-bg-3      { syntax: '<color>'; inherits: true; initial-value: #202327; }
@property --c-border    { syntax: '<color>'; inherits: true; initial-value: #2f3336; }
@property --c-text      { syntax: '<color>'; inherits: true; initial-value: #e7e9ea; }
@property --c-text-2    { syntax: '<color>'; inherits: true; initial-value: #8b98a5; }
@property --c-accent    { syntax: '<color>'; inherits: true; initial-value: #1d9bf0; }
@property --c-accent-2  { syntax: '<color>'; inherits: true; initial-value: #1a8cd8; }
@property --c-accent-fill{ syntax: '<color>'; inherits: true; initial-value: #157abd; }
@property --c-accent-ink{ syntax: '<color>'; inherits: true; initial-value: #ffffff; }
@property --c-scrim     { syntax: '<color>'; inherits: true; initial-value: rgba(0,0,0,.65); }

:root {
  /* ---- palette: normal ------------------------------------------------ */
  --c-bg:         #000000;
  --c-bg-2:       #16181c;   /* elevated surfaces, inputs, sidebar cards   */
  --c-bg-3:       #202327;   /* pressed / secondary button                 */
  --c-border:     #2f3336;
  --c-text:       #e7e9ea;
  --c-text-2:     #8b98a5;   /* meta text — AA on #000                     */
  --c-accent:     #1d9bf0;   /* text, icons, borders — 7.00:1 on #000       */
  --c-accent-2:   #1a8cd8;
  --c-accent-fill:#157abd;   /* filled surfaces — 4.61:1 with white ink      */
  --c-accent-ink: #ffffff;
  --c-scrim:      rgba(0,0,0,.65);

  /* engagement colours (normal feed only) */
  --c-reply:  #1d9bf0;
  --c-repost: #00ba7c;
  --c-like:   #f91880;

  /* verification colours (crisis feed only) */
  --v-verified:    #3ecf7f;
  --v-official:    #5aabf5;
  --v-unverified:  #ffb020;
  --v-disputed:    #ff5c52;

  /* hover / halo tints, derived */
  --hover-row:  rgba(255,255,255,.03);
  --halo-alpha: .12;

  /* ---- type scale ----------------------------------------------------- */
  --fs-body: 15px;
  --fs-meta: 13px;
  --fs-name: 20px;
  --lh-body: 20px;

  --ff: "TwitterChirp", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;

  /* ---- metrics -------------------------------------------------------- */
  --avatar: 40px;
  --gutter: 12px;
  --pad-x: 16px;
  --icon: 18.75px;
  --halo: 34.75px;
  --col-nav: 275px;
  --col-feed: 600px;
  --col-side: 350px;
  --tabbar-h: 53px;
  --header-h: 53px;

  /* ---- motion --------------------------------------------------------- */
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-in:  cubic-bezier(0.55, 0.06, 0.68, 0.19);
  --t-palette: 400ms;

  color-scheme: dark;

  transition:
    --c-bg var(--t-palette) linear,
    --c-bg-2 var(--t-palette) linear,
    --c-bg-3 var(--t-palette) linear,
    --c-border var(--t-palette) linear,
    --c-text var(--t-palette) linear,
    --c-text-2 var(--t-palette) linear,
    --c-accent var(--t-palette) linear,
    --c-accent-2 var(--t-palette) linear,
    --c-accent-fill var(--t-palette) linear,
    --c-accent-ink var(--t-palette) linear;
}

/* ---- palette: crisis --------------------------------------------------- */
:root[data-palette="crisis"] {
  --c-bg:         #070502;   /* still near-black, warm cast                */
  --c-bg-2:       #1c1409;
  --c-bg-3:       #2a1e0e;
  --c-border:     #3f2f16;
  --c-text:       #f7f0e6;
  --c-text-2:     #b0a08a;   /* AA on #070502                              */
  --c-accent:     #ff9d2e;   /* high-contrast amber — 9.80:1 on #070502    */
  --c-accent-2:   #ffb15c;
  --c-accent-fill:#ff9d2e;   /* dark ink on amber — 9.32:1                  */
  --c-accent-ink: #150c02;   /* dark ink on amber fills                    */
  --c-scrim:      rgba(12,7,2,.72);

  --hover-row:  rgba(255, 200, 130, .045);
  --halo-alpha: .14;
}

/* Reduced motion: no palette cross-fade, no springs. */
@media (prefers-reduced-motion: reduce) {
  :root { transition: none; --t-palette: 0ms; }
}

/* Low-bandwidth mode kills the cross-fade too. */
:root[data-plain="1"] { transition: none; }

/* ===== styles/base.css ===== */
/* ==========================================================================
   MİHENK — base: reset, shell layout, nav, buttons, overlays
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--ff);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}
body { min-height: 100vh; }

button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; }
a { color: var(--c-accent); text-decoration: none; }
a:hover { text-decoration: underline; }
ul { list-style: none; margin: 0; padding: 0; }

/* ---- focus rings: always visible, never removed without replacement ---- */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 2px;
  border-radius: 4px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 8px; top: -60px; z-index: 200;
  background: var(--c-accent-fill); color: var(--c-accent-ink);
  padding: 10px 16px; border-radius: 999px; font-weight: 700;
  transition: top 160ms var(--ease-out);
}
.skip-link:focus-visible { top: 8px; text-decoration: none; }

/* ---- icons ------------------------------------------------------------- */
.ic {
  width: var(--icon); height: var(--icon);
  display: block; flex: none;
  fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.ic--fill { fill: currentColor; stroke: none; }
.ic--lg { width: 24px; height: 24px; }
.ic--sm { width: 15px; height: 15px; stroke-width: 2.2; }

/* ---- app shell --------------------------------------------------------- */
.shell {
  display: grid;
  grid-template-columns: var(--col-nav) minmax(0, var(--col-feed)) var(--col-side);
  justify-content: center;
  gap: 0;
  max-width: 1265px;
  margin: 0 auto;
}

/* ---- left nav ---------------------------------------------------------- */
.nav {
  grid-column: 1;
  position: sticky; top: 0; align-self: start;
  height: 100vh;
  display: flex; flex-direction: column;
  padding: 0 8px 20px;
  border-right: 1px solid var(--c-border);
}
.nav__brand {
  display: flex; align-items: center; justify-content: flex-start;
  width: 52px; height: 52px; margin: 2px 0 2px 4px;
  border-radius: 50%; padding-left: 8px;
  transition: background-color 160ms var(--ease-out);
}
.nav__brand:hover { background: var(--hover-row); }
.nav__brand svg { width: 30px; height: 30px; }
.nav__list { flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px; }
.nav__item {
  display: flex; align-items: center; gap: 18px;
  padding: 11px 14px 11px 12px;
  border-radius: 999px;
  font-size: 20px; line-height: 24px;
  color: var(--c-text);
  width: max-content; max-width: 100%;
  transition: background-color 160ms var(--ease-out);
}
.nav__item:hover { background: rgba(255,255,255,.08); }
.nav__item:disabled { opacity: .42; }
.nav__item:disabled:hover { background: none; }
.nav__item[aria-current="page"] { font-weight: 700; }
.nav__post {
  margin: 16px 4px 0;
  height: 52px; border-radius: 999px;
  background: var(--c-accent-fill); color: var(--c-accent-ink);
  font-size: 17px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  transition: filter 160ms var(--ease-out), transform 160ms var(--ease-out);
}
.nav__post:hover { filter: brightness(.92); }
.nav__post:active { transform: scale(.97); }
.nav__me {
  margin-top: auto; display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: 999px; width: 100%;
  transition: background-color 160ms var(--ease-out);
}
.nav__me:hover { background: rgba(255,255,255,.08); }
.nav__me-txt { min-width: 0; text-align: left; }
.nav__me-name { font-weight: 700; font-size: 15px; line-height: 20px; }
.nav__me-handle { color: var(--c-text-2); font-size: 15px; line-height: 20px; }

/* ---- centre column ----------------------------------------------------- */
.main {
  grid-column: 2;
  min-width: 0;
  border-right: 1px solid var(--c-border);
  min-height: 100vh;
}

/* header hides on scroll down, reveals on scroll up */
.topbar {
  position: sticky; top: 0; z-index: 30;
  transition: transform 200ms var(--ease-out);
  will-change: transform;
}
.topbar[data-hidden="1"] { transform: translate3d(0, -100%, 0); }
.topbar__row {
  height: var(--header-h);
  display: none;
  align-items: center; padding: 0 var(--pad-x); gap: 20px;
  background: color-mix(in srgb, var(--c-bg) 85%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  font-size: 20px; font-weight: 700;
}

/* ---- tab bar ----------------------------------------------------------- */
.tabs {
  display: flex; align-items: stretch;
  height: var(--tabbar-h);
  position: relative;
  background: color-mix(in srgb, var(--c-bg) 85%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--c-border);
}
.tab {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  color: var(--c-text-2); font-size: 15px; font-weight: 500;
  padding: 0 12px;
  transition: background-color 160ms var(--ease-out), color 160ms var(--ease-out);
  position: relative;
}
.tab:hover { background: rgba(255,255,255,.06); }
.tab[aria-selected="true"] { color: var(--c-text); font-weight: 700; }
.tab__label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab--crisis { color: var(--c-accent); }
.tab--crisis[aria-selected="true"] { color: var(--c-accent); }
.tab--crisis .ic { animation: warn-pulse var(--pulse-dur, 2s) ease-in-out infinite; transform-origin: 50% 60%; }
@keyframes warn-pulse {
  0%, 100% { opacity: .65; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.16); }
}
/* tab enter / leave */
.tab--enter { animation: tab-in 240ms var(--ease-out) both; }
@keyframes tab-in {
  from { opacity: 0; transform: translate3d(24px, 0, 0); }
  to   { opacity: 1; transform: none; }
}
.tab--leave { animation: tab-out 220ms var(--ease-in) both; }
@keyframes tab-out {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translate3d(28px, 0, 0); }
}

.tabs__underline {
  position: absolute; left: 0; bottom: 0;
  height: 4px; width: 60px; border-radius: 999px;
  background: var(--c-accent);
  transform-origin: 50% 50%;
  will-change: transform;
  transition: transform 300ms var(--spring);
}
.tabs__underline[data-squash="1"] { transition: transform 150ms var(--ease-out); }

/* ---- right sidebar ----------------------------------------------------- */
.side {
  grid-column: 3;
  padding: 0 0 40px 28px;
  position: sticky; top: 0; align-self: start;
  height: 100vh; overflow-y: auto;
  scrollbar-width: none;
}
.side::-webkit-scrollbar { display: none; }
.side__search {
  position: sticky; top: 0; z-index: 5; padding: 6px 0 12px;
  background: var(--c-bg);
}
.side__search-box {
  display: flex; align-items: center; gap: 12px;
  height: 44px; padding: 0 16px; border-radius: 999px;
  background: var(--c-bg-2); color: var(--c-text-2);
  border: 1px solid transparent;
  transition: border-color 160ms var(--ease-out), background-color 160ms var(--ease-out);
}
.side__search-box:focus-within { border-color: var(--c-accent); background: var(--c-bg); color: var(--c-accent); }
.side__search-box input {
  flex: 1; background: none; border: 0; color: var(--c-text);
  font-size: 15px;
}
.card {
  background: var(--c-bg-2);
  border-radius: 16px; margin-bottom: 16px; overflow: hidden;
}
.card__h { font-size: 20px; font-weight: 800; padding: 12px 16px 4px; }
.card__row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  transition: background-color 160ms var(--ease-out);
  width: 100%; text-align: left;
}
.card__row:hover { background: rgba(255,255,255,.03); }
.card__row-main { flex: 1; min-width: 0; }
.card__k { font-size: var(--fs-meta); color: var(--c-text-2); }
.card__t { font-size: 15px; font-weight: 700; }
.card__more { padding: 12px 16px; color: var(--c-accent); font-size: 15px; display: block; width: 100%; text-align: left; }
.card__more:disabled { color: var(--c-text-2); opacity: .55; }
.btn-follow {
  background: var(--c-text); color: var(--c-bg);
  border-radius: 999px; height: 32px; padding: 0 16px; font-weight: 700; font-size: 14px;
  transition: filter 160ms var(--ease-out);
}
.btn-follow:hover { filter: brightness(.9); }
.card__row[aria-pressed="true"] .btn-follow { background: transparent; color: var(--c-text); border: 1px solid var(--c-border); }

/* ---- local feed search ------------------------------------------------ */
.feed-search {
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto 34px;
  align-items: center; gap: 10px; padding: 10px var(--pad-x);
  border-bottom: 1px solid var(--c-border); background: var(--c-bg);
}
.feed-search[hidden] { display: none; }
.feed-search__icon { color: var(--c-text-2); }
.feed-search input { min-width: 0; border: 0; background: transparent; font-size: 16px; }
.feed-search__status { color: var(--c-text-2); font-size: var(--fs-meta); white-space: nowrap; }
.feed-search button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; }
.feed-search button:hover { background: var(--hover-row); }

/* ---- avatars ----------------------------------------------------------- */
.av {
  width: var(--avatar); height: var(--avatar);
  border-radius: 50%; flex: none; overflow: hidden;
  display: block; background: var(--c-bg-3);
}
.av svg { width: 100%; height: 100%; display: block; }
.av--sm { width: 32px; height: 32px; }
.av--lg { width: 48px; height: 48px; }

/* ---- generic buttons --------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 999px; height: 36px; padding: 0 16px;
  font-weight: 700; font-size: 15px;
  background: var(--c-accent-fill); color: var(--c-accent-ink);
  transition: filter 160ms var(--ease-out), transform 120ms var(--ease-out), opacity 160ms;
}
.btn:hover { filter: brightness(.92); }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn--ghost { background: transparent; color: var(--c-text); border: 1px solid var(--c-border); }
.btn--ghost:hover { background: rgba(255,255,255,.06); filter: none; }
.btn--lg { height: 52px; font-size: 17px; padding: 0 24px; }
.btn--block { width: 100%; }

/* ---- toast ------------------------------------------------------------- */
.toast-layer {
  position: fixed; inset: 0 0 auto 0; z-index: 120;
  display: flex; flex-direction: column; align-items: center;
  pointer-events: none; padding-top: 12px; gap: 8px;
}
.toast {
  pointer-events: auto;
  max-width: min(92vw, 460px);
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px; border-radius: 999px;
  background: var(--c-accent-fill); color: var(--c-accent-ink);
  font-size: 15px; font-weight: 600;
  box-shadow: 0 8px 28px rgba(0,0,0,.5);
  animation: toast-in 280ms var(--ease-out) both;
  will-change: transform, opacity;
}
.toast[data-leaving="1"] { animation: toast-out 220ms var(--ease-in) both; }
@keyframes toast-in  { from { opacity: 0; transform: translate3d(0,-100%,0); } to { opacity: 1; transform: none; } }
@keyframes toast-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate3d(0,-120%,0); } }
.toast--muted { background: var(--c-bg-3); color: var(--c-text); border: 1px solid var(--c-border); }

/* ---- modal ------------------------------------------------------------- */
.modal-layer {
  position: fixed; inset: 0; z-index: 140;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-layer[hidden] { display: none; }
.modal__scrim {
  position: absolute; inset: 0;
  background: var(--c-scrim);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fade-in 200ms var(--ease-out) both;
}
.modal {
  position: relative;
  width: min(100%, 480px);
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 24px 60px rgba(0,0,0,.6);
  animation: modal-in 200ms var(--ease-out) both;
  will-change: transform, opacity;
}
@keyframes modal-in { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes fade-in  { from { opacity: 0; } to { opacity: 1; } }
.modal[data-leaving="1"] { animation: modal-out 160ms var(--ease-in) both; }
@keyframes modal-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.96); } }
.modal__h { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
.modal__p { color: var(--c-text-2); margin: 0 0 6px; font-size: 15px; }
.modal__actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

/* ---- skeletons --------------------------------------------------------- */
.skel-list { padding: 0; }
.sk-row {
  display: flex; gap: var(--gutter);
  padding: 12px var(--pad-x);
  border-bottom: 1px solid var(--c-border);
}
.sk {
  background: linear-gradient(90deg,
    var(--c-bg-2) 0%, var(--c-bg-3) 40%, var(--c-bg-2) 80%);
  background-size: 300% 100%;
  border-radius: 6px;
  animation: shimmer 1.4s linear infinite;
}
.sk--av { width: var(--avatar); height: var(--avatar); border-radius: 50%; flex: none; }
.sk--l { height: 12px; }
@keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

/* ---- demo panel -------------------------------------------------------- */
.demo {
  position: fixed; right: 16px; bottom: 16px; z-index: 160;
  width: 258px; padding: 14px;
  background: rgba(22,24,28,.92);
  border: 1px solid var(--c-border); border-radius: 14px;
  backdrop-filter: blur(10px);
  font-size: 13px; box-shadow: 0 16px 40px rgba(0,0,0,.55);
}
.demo h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--c-text-2); }
.demo__grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
.demo__btn {
  text-align: left; padding: 8px 10px; border-radius: 8px;
  background: var(--c-bg-3); color: var(--c-text);
  transition: background-color 140ms var(--ease-out);
}
.demo__btn:hover { background: #2c3138; }
.demo__btn[data-active="1"] { background: var(--c-accent-fill); color: var(--c-accent-ink); font-weight: 700; }
.demo__hr { height: 1px; background: var(--c-border); margin: 10px 0; }
.demo__note { color: var(--c-text-2); line-height: 1.4; }

/* ---- synthetic cursor -------------------------------------------------- */
.cursor {
  position: fixed; z-index: 190; left: 0; top: 0;
  width: 22px; height: 22px; margin: -11px 0 0 -11px;
  border-radius: 50%;
  background: rgba(255,255,255,.92);
  box-shadow: 0 2px 10px rgba(0,0,0,.55), 0 0 0 2px rgba(0,0,0,.25);
  pointer-events: none; opacity: 0;
  transition: opacity 220ms linear;
  will-change: transform, opacity;
}
.cursor[data-on="1"] { opacity: 1; }
.cursor__ripple {
  position: absolute; inset: -9px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.9);
  opacity: 0; transform: scale(.4);
}
.cursor[data-click="1"] .cursor__ripple { animation: ripple 420ms var(--ease-out); }
@keyframes ripple {
  0%   { opacity: .9; transform: scale(.35); }
  100% { opacity: 0;  transform: scale(2.1); }
}

/* ---- capture caption strip --------------------------------------------- */
.capstrip {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 185;
  padding: 40px 24px 22px;
  background: linear-gradient(to top, rgba(0,0,0,.97) 0%, rgba(0,0,0,.9) 55%, rgba(0,0,0,0) 100%);
  color: #fff; font-size: 20px; font-weight: 600; letter-spacing: -.01em;
  text-align: center;
  animation: cap-in 400ms var(--ease-out) both;
  pointer-events: none;
}
@keyframes cap-in { from { opacity: 0; transform: translate3d(0,6px,0); } to { opacity: 1; transform: none; } }

/* ---- responsive -------------------------------------------------------- */
/* 1265px: the nav collapses to an icon rail, as on the reference client */
@media (max-width: 1265px) {
  .shell { grid-template-columns: 88px minmax(0, var(--col-feed)) 290px; max-width: 1000px; }
  .nav { padding: 0 4px 20px; align-items: center; }
  .nav__item { width: 52px; height: 52px; justify-content: center; padding: 0; gap: 0; }
  .nav__item span, .nav__me-txt { display: none; }
  .nav__post { width: 52px; padding: 0; margin: 16px 0 0; }
  .nav__post span { display: none; }
  .nav__me { justify-content: center; width: 52px; padding: 12px 0; }
  .nav__me > .ic { display: none; }
  .side { padding-left: 20px; }
}
/* 1000px: the secondary column goes */
@media (max-width: 1000px) {
  .shell { grid-template-columns: 88px minmax(0, var(--col-feed)); max-width: 700px; }
  .side { display: none; }
}
@media (max-width: 700px) {
  .shell { grid-template-columns: minmax(0, 1fr); max-width: 100%; }
  .nav { display: none; }
  .main { border: 0; padding-bottom: 64px; }
  .topbar__row { display: flex; }
  :root { --pad-x: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-property: opacity !important;
    transition-duration: 120ms !important;
    scroll-behavior: auto !important;
  }
  .tab--crisis .ic { animation: none; opacity: 1; }
}

/* ---- prototype controls: sidebar copy vs in-feed copy ------------------- */
.proto-ctl-mobile { display: none; padding: 12px var(--pad-x) 40px; }
.proto-ctl-mobile .card { margin: 0; }
@media (max-width: 1000px) { .proto-ctl-mobile { display: block; } }
:root[data-plain="1"] .proto-ctl-mobile,
:root[data-plain="1"] .proto-ctl { display: none !important; }

/* skeleton panel shares feed activation */
.feed--skel[data-active="1"] { display: block; }

/* hidden must win over display:flex on components */
[hidden] { display: none !important; }

/* sidebar card rows stack their lines */
.card__row-main > span { display: block; }
.card__row-main .card__t { display: flex; align-items: center; gap: 4px; }

/* ===== styles/feed.css ===== */
/* ==========================================================================
   MİHENK — feed: post rows, actions, composer, feed transitions
   ========================================================================== */

.feeds { position: relative; }

.feed { display: none; }
.feed[data-active="1"] { display: block; }
.post[data-search-hidden="1"], .cpost[data-search-hidden="1"] { display: none !important; }

/* tab transition: outgoing / incoming */
.feed[data-anim="out-left"]  { display: block; animation: feed-out-l 180ms var(--ease-in) both; pointer-events: none; }
.feed[data-anim="out-right"] { display: block; animation: feed-out-r 180ms var(--ease-in) both; pointer-events: none; }
@keyframes feed-out-l { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate3d(-12px,0,0); } }
@keyframes feed-out-r { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate3d(12px,0,0); } }

.feed[data-anim="in-left"]  { animation: feed-in-l 220ms var(--ease-out) both; }
.feed[data-anim="in-right"] { animation: feed-in-r 220ms var(--ease-out) both; }
@keyframes feed-in-l { from { opacity: 0; transform: translate3d(-12px,0,0); } to { opacity: 1; transform: none; } }
@keyframes feed-in-r { from { opacity: 0; transform: translate3d(12px,0,0); } to { opacity: 1; transform: none; } }

/* per-row stagger for the first 6 rows of an incoming feed */
.post--stagger {
  animation: row-in 260ms var(--ease-out) both;
  animation-delay: calc(var(--i) * 30ms);
}
@keyframes row-in { from { opacity: 0; transform: translate3d(0,8px,0); } to { opacity: 1; transform: none; } }

/* ---- post row ---------------------------------------------------------- */
.post {
  display: flex; gap: var(--gutter);
  padding: 12px var(--pad-x) 4px;
  border-bottom: 1px solid var(--c-border);
  position: relative;
  cursor: pointer;
  transition: background-color 140ms var(--ease-out);
  will-change: transform;
}
.post:hover { background: var(--hover-row); }
.post:focus-visible { outline-offset: -2px; }

.post__col { flex: 1 1 auto; min-width: 0; }

.post__head {
  display: flex; align-items: baseline; gap: 4px;
  font-size: var(--fs-meta); color: var(--c-text-2);
  line-height: 20px;
}
.post__name {
  font-size: var(--fs-name); line-height: 24px; font-weight: 700; color: var(--c-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: -.01em;
  max-width: 46%;
}
.post__name:hover { text-decoration: underline; }
.post__verified { color: var(--c-accent); align-self: center; }
.post__handle, .post__dot, .post__time {
  white-space: nowrap; font-size: var(--fs-meta);
}
.post__handle { overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
.post__more {
  margin-left: auto; align-self: flex-start;
  width: var(--halo); height: var(--halo); border-radius: 50%;
  display: grid; place-items: center; color: var(--c-text-2);
  transition: background-color 140ms var(--ease-out), color 140ms var(--ease-out);
}
.post__more:hover { background: color-mix(in srgb, var(--c-accent) 14%, transparent); color: var(--c-accent); }

.post__body {
  font-size: var(--fs-body); line-height: var(--lh-body);
  color: var(--c-text);
  white-space: pre-wrap; overflow-wrap: anywhere;
  margin-top: 2px;
}
.post__body a, .post__tagref { color: var(--c-accent); }

.post__media {
  margin-top: 12px; border-radius: 16px; overflow: hidden;
  border: 1px solid var(--c-border);
  aspect-ratio: 16 / 9;
}
.post__media svg { display: block; width: 100%; height: 100%; }
.post__media img { display: block; width: 100%; height: 100%; object-fit: cover; }

.post__quote {
  margin-top: 12px; border: 1px solid var(--c-border); border-radius: 16px;
  padding: 12px; font-size: var(--fs-body);
}
.post__quote-h { display: flex; align-items: center; gap: 6px; font-size: var(--fs-meta); color: var(--c-text-2); }
.post__quote-h b { color: var(--c-text); font-size: var(--fs-meta); }

/* ---- action bar -------------------------------------------------------- */
.acts {
  display: flex; justify-content: space-between;
  max-width: 425px; margin-top: 4px;
  color: var(--c-text-2);
}
.act {
  display: flex; align-items: center; gap: 2px;
  color: inherit; font-size: var(--fs-meta);
  position: relative;
  padding: 0 2px 0 0;
  border-radius: 999px;
  transition: color 140ms var(--ease-out);
}
.act__halo {
  width: var(--halo); height: var(--halo); border-radius: 50%;
  display: grid; place-items: center; position: relative;
}
.act__halo::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: currentColor; opacity: 0;
  transform: scale(.85);
  transition: opacity 120ms var(--ease-out), transform 120ms var(--ease-out);
}
.act:hover .act__halo::before { opacity: var(--halo-alpha); transform: scale(1); }
.act__n { min-width: 14px; text-align: left; font-variant-numeric: tabular-nums; }
.act .ic { position: relative; }

.act--reply:hover  { color: var(--c-reply); }
.act--repost:hover { color: var(--c-repost); }
.act--like:hover   { color: var(--c-like); }
.act--views:hover  { color: var(--c-reply); }
.act--share:hover  { color: var(--c-reply); }

.act[data-on="1"].act--like   { color: var(--c-like); }
.act[data-on="1"].act--repost { color: var(--c-repost); }
.act[data-on="1"] .ic { fill: currentColor; }
.act--repost[data-on="1"] .ic { fill: none; }

.act[data-bounce="1"] .ic { animation: spring-pop 260ms var(--spring); }
@keyframes spring-pop {
  0% { transform: scale(1); } 45% { transform: scale(1.3); } 100% { transform: scale(1); }
}
.act[data-bounce="1"] .act__n { animation: n-pop 260ms var(--ease-out); }
@keyframes n-pop { 0% { transform: translateY(0); } 40% { transform: translateY(-3px); } 100% { transform: translateY(0); } }

/* ---- composer ---------------------------------------------------------- */
.composer {
  display: flex; gap: var(--gutter);
  padding: 4px var(--pad-x) 0;
  border-bottom: 1px solid var(--c-border);
}
.composer__col { flex: 1; min-width: 0; padding-top: 12px; }
.composer__ta {
  width: 100%; border: 0; background: none; resize: none;
  color: var(--c-text); font-size: 20px; line-height: 24px;
  padding: 12px 0; min-height: 52px; overflow: hidden;
}
.composer__ta::placeholder { color: var(--c-text-2); }
.composer__ta:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 4px; border-radius: 4px; }
.composer__bar {
  display: flex; align-items: center; gap: 2px;
  padding: 4px 0 12px; border-top: 1px solid transparent;
}
.composer__tool {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; color: var(--c-accent);
  transition: background-color 140ms var(--ease-out);
}
.composer__tool:hover { background: color-mix(in srgb, var(--c-accent) 14%, transparent); }
.composer__tool:disabled { opacity: .42; }
.composer__tool:disabled:hover { background: none; }
.composer__post { margin-left: auto; }

/* FAB on mobile */
.fab {
  position: fixed; right: 16px; bottom: 76px; z-index: 60;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--c-accent-fill); color: var(--c-accent-ink);
  display: none; place-items: center;
  box-shadow: 0 6px 20px rgba(0,0,0,.5);
  transition: transform 140ms var(--ease-out);
}
.fab:active { transform: scale(.94); }
.bottombar {

       .move('#go-crisis', sec(.45)).click('#go-crisis')
       .wait(sec(1.3))
       .move('#ctagsel .chip[data-tag="yardim"]', sec(.45)).click('#ctagsel .chip[data-tag="yardim"]')
       .wait(sec(.35))
       .move('#cpostbtn', sec(.35)).click('#cpostbtn')
       .wait(sec(2.4))
       .at(function () { M.setTab('foryou'); })
       .wait(sec(1.0));
      return s;
    } },

    /* 5 — full İmdat flow through to AFAD'a iletildi                     */
    imdat: { dur: 10.4, setup: function () {
      resetAll(); crisisNow();
      tabNow('crisis');
    }, build: function () {
      var s = new Seq();
      s.wait(sec(.3))
       .move('#sos', sec(.5)).click('#sos')
       .wait(sec(.7))
       .move('[data-need="kurtarma"]', sec(.45)).click('[data-need="kurtarma"]')
       .wait(sec(.2))
       .move('[data-need="saglik"]', sec(.35)).click('[data-need="saglik"]')
       .wait(sec(.25))
       .move('[data-flow="next"]', sec(.4)).click('[data-flow="next"]')
       .wait(sec(.75))
       .type('#addr', 'Toplanma alanı yakını', sec(.85))
       .wait(sec(.2))
       .move('[data-flow="next"]', sec(.4)).click('[data-flow="next"]')
       .wait(sec(.5))
       .move('[data-step="1"]', sec(.35)).click('[data-step="1"]', 10).click('[data-step="1"]', 10)
       .wait(sec(.3))
       .move('[data-flow="next"]', sec(.4)).click('[data-flow="next"]')
       .wait(sec(.7))
       .move('[data-flow="next"]', sec(.35)).click('[data-flow="next"]')
       .wait(sec(2.7))
       .move('[data-flow="close"]', sec(.4)).click('[data-flow="close"]')
       .wait(sec(.6));
      return s;
    } },

    /* 6 — low-bandwidth mode strips the interface, byte chip animates   */
    'plain-mode': { dur: 5.4, setup: function () {
      resetAll(); crisisNow();
      tabNow('crisis');
    }, build: function () {
      var s = new Seq();
      s.wait(sec(.45))
       .move('#lowband', sec(.55)).click('#lowband')
       .wait(sec(2.1))
       .move('#lowband', sec(.4)).click('#lowband')
       .wait(sec(1.2));
      return s;
    } }
  };

  M.scenarios = Object.keys(SCEN);
  M.scenarioDur = function (id) { return SCEN[id] ? SCEN[id].dur : 0; };

  function run(id, onEnd) {
    var sc = SCEN[id];
    if (!sc) return false;
    stop(false);
    clock.id = id;
    sc.setup();
    M.moveUnderline(false);
    var seq = sc.build();
    clock.tl = seq.tl.slice().sort(function (a, b) { return a.f - b.f; });
    clock.i = 0;
    clock.frame = 0;
    /* +0.6s tail so every in-flight transition settles before the loop point */
    clock.total = Math.max(sec(sc.dur), seq.f) + sec(.6);
    /* Phase-lock the 2s warning pulse to the clip length so an infinite
       animation cannot leave a seam at the loop point. */
    if (CAPT) {
      var clipMs = clock.total / FPS * 1000;
      var cycles = Math.max(1, Math.round(clipMs / 2000));
      document.documentElement.style.setProperty('--pulse-dur', (clipMs / cycles).toFixed(2) + 'ms');
      /* The 2s warning pulse is an infinite composited animation: it would
         both seam at the loop point and get left out of a frame grab. Under
         capture we drive it from the same clock instead, at a period that
         divides the clip exactly. */
      pulsePeriod = clock.total / cycles;
    }
    clock.onEnd = onEnd || null;
    clock.running = true;
    /* park the cursor invisibly; it fades in on its first move and fades
       back out before the last frame so the clip loops without a seam */
    cursorPut(window.innerWidth * 0.52, window.innerHeight * 0.78);
    cursorOff();
    if (CAPT) {
      /* Under frame-by-frame capture the fade is driven from the clock and
         the node is removed before the last frame, so the grabbed pixels
         always agree with the state — a CSS opacity transition can be left
         un-composited by a paused compositor. */
      clock.tl.push({ f: Math.max(1, clock.total - 26), fn: function () {
        var c = ensureCursor();
        clock.tweens.push({ t: 0, d: 16, step: function (p) { c.style.opacity = String(1 - p); } });
      } });
      clock.tl.push({ f: Math.max(2, clock.total - 8), fn: function () {
        if (cur && cur.parentNode) cur.parentNode.removeChild(cur);
        cur = null;
      } });
    } else {
      clock.tl.push({ f: Math.max(1, clock.total - 22), fn: cursorOff });
    }
    clock.tl.sort(function (a, b) { return a.f - b.f; });
    setCaption(CAPTION[id]);
    var b = $('.demo__btn[data-sc="' + id + '"]');
    $$('.demo__btn').forEach(function (x) { x.dataset.active = ''; });
    if (b) b.dataset.active = '1';
    if (!CAPT) requestAnimationFrame(tick);
    return true;
  }
  M.runScenario = run;

  /* --------------------------------------------------------- caption */
  function setCaption(text) {
    if (!CAPT) return;
    var c = $('#capstrip');
    if (!c) {
      c = el('<div class="capstrip" id="capstrip"></div>');
      document.body.appendChild(c);
    }
    c.textContent = text || '';
    c.style.animation = 'none';
    void c.offsetWidth;
    c.style.animation = '';
  }

  /* ------------------------------------------------------------ panel */
  var Q = new URLSearchParams(location.search);
  var DEMO = Q.get('demo') === '1';
  var CAPT = Q.get('capture') === '1';
  M.capture = CAPT;

  M.initDemo = function () {
    if (CAPT) {
      document.documentElement.dataset.capture = '1';
      var st = document.createElement('style');
      /* Frame-by-frame capture paints on the main thread: promoted layers
         would keep compositor-driven transitions out of the grabbed frame. */
      st.textContent = '.proto-ctl,.proto-ctl-mobile,.demo{display:none!important}' +
        'html,body{overflow-x:hidden}' +
        '::-webkit-scrollbar{width:0;height:0}' +
        '*{will-change:auto!important}';
      document.head.appendChild(st);
    }

    if (DEMO) {
      var p = el('<aside class="demo" id="demo" aria-label="Demo kontrolleri">' +
        '<h3>Demo senaryoları</h3><div class="demo__grid">' +
        M.scenarios.map(function (id, i) {
          return '<button class="demo__btn" type="button" data-sc="' + id + '">' +
            (i + 1) + '. ' + id + ' · ' + SCEN[id].dur.toFixed(1) + 's</button>';
        }).join('') +
        '</div><div class="demo__hr"></div><div class="demo__grid">' +
        '<button class="demo__btn" type="button" data-demo="reset">Sıfırla</button>' +
        '</div><div class="demo__hr"></div>' +
        '<p class="demo__note">Sanal saat: rAF kare sayacı. Aynı senaryo her çalıştırmada kare kare aynıdır.</p>' +
        '</aside>');
      document.body.appendChild(p);
      p.addEventListener('click', function (e) {
        var b = e.target.closest('[data-sc]');
        if (b) { run(b.dataset.sc); return; }
        var d = e.target.closest('[data-demo]');
        if (!d) return;
        if (d.dataset.demo === 'reset') { stop(false); resetAll(); }
      });
    }

    var auto = Q.get('scenario');
    if (auto && SCEN[auto]) {
      window.__MIHENK_READY = false;
      setTimeout(function () {
        SCEN[auto].setup();
        setCaption(CAPTION[auto]);
        window.__MIHENK_READY = true;
        if (!CAPT) run(auto);
      }, 120);
    } else {
      window.__MIHENK_READY = true;
    }

    /* headless capture API */
    window.__mihenk = {
      run: function (id) { return run(id); },
      step: function () { tick(); return clock.frame; },
      reset: resetAll,
      frame: function () { return clock.frame; },
      total: function () { return clock.total; },
      running: function () { return clock.running; },
      scenarios: M.scenarios,
      dur: function (id) { return SCEN[id] ? SCEN[id].dur : 0; },
      caption: function (id) { return CAPTION[id]; },
      setup: function (id) { if (SCEN[id]) { SCEN[id].setup(); setCaption(CAPTION[id]); } }
    };
  };

})(window.MIHENK = window.MIHENK || {});

</script>
